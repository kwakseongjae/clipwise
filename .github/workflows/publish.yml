name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub release
  id-token: write   # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm Trusted Publishing(OIDC)은 npm >= 11.5 필요 — 토큰 없이 배포
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted Publishing — npmjs.com 패키지 설정 > Trusted Publisher에
      # (GitHub Actions: kwakseongjae/clipwise · publish.yml) 1회 등록 필요. 토큰 불필요.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
